<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FE3FF"/>
      <stop offset="0.38" stop-color="#35B4E8"/>
      <stop offset="1" stop-color="#0A5C8F"/>
    </linearGradient>
    <linearGradient id="sleeveGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E6EA6"/>
      <stop offset="1" stop-color="#063D63"/>
    </linearGradient>
    <linearGradient id="discGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.30" stop-color="#CFEEFB"/>
      <stop offset="0.55" stop-color="#8FD4F0"/>
      <stop offset="0.78" stop-color="#E8F8FF"/>
      <stop offset="1" stop-color="#9BC9DE"/>
    </linearGradient>
    <linearGradient id="glossGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="facetBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18"
                    flood-color="#031F33" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>
    <clipPath id="sleeveClip">
      <rect x="150" y="277" width="470"
            height="470" rx="20"/>
    </clipPath>
  </defs>
  <g id="background" clip-path="url(#squircleClip)">
    <rect x="100" y="100" width="824" height="824"
          rx="184" fill="url(#bgGradient)"/>
    <!-- Crystal facets: noticeable at 1024 px, invisible from 128 px down.
         Blurred, so that no edge is left that survives scaling down
         unscathed. -->
    <g filter="url(#facetBlur)">
      <polygon points="100,556 476,100 648,100 100,748" fill="#FFFFFF" opacity="0.05"/>
      <polygon points="924,262 924,486 596,924 372,924" fill="#FFFFFF" opacity="0.032"/>
    </g>
  </g>
  <g id="disc" clip-path="url(#squircleClip)">
    <g transform="translate(10,0)">
      <circle cx="620" cy="512" r="235"
              fill="url(#discGradient)" filter="url(#softShadow)"/>
      <circle cx="620" cy="512" r="88"
              fill="#063D63" opacity="0.18"/>
      <circle cx="620" cy="512" r="42" fill="#F6FCFF"/>
      <circle cx="620" cy="512" r="42" fill="none"
              stroke="#0A5C8F" stroke-opacity="0.30" stroke-width="3"/>
    </g>
  </g>
  <g id="sleeve" clip-path="url(#squircleClip)">
    <g transform="translate(10,0)">
      <rect x="150" y="277" width="470"
            height="470" rx="20"
            fill="url(#sleeveGradient)" filter="url(#softShadow)"/>
      <!-- Gloss edge, clipped to the sleeve shape -->
      <rect x="150" y="277" width="470" height="46"
            fill="url(#glossGradient)" clip-path="url(#sleeveClip)"/>
      <!-- Opening slit the CD comes out of -->
      <rect x="602" y="297" width="16"
            height="430" rx="8"
            fill="#031F33" opacity="0.45"/>
    </g>
  </g>
  <g id="metadata" clip-path="url(#squircleClip)">
    <g transform="translate(10,0)">
      <rect x="196" y="400" width="330" height="30" rx="15" fill="#EAF7FF" opacity="0.92"/>
      <rect x="196" y="456" width="238" height="30" rx="15" fill="#EAF7FF" opacity="0.62"/>
      <rect x="196" y="512" width="286" height="30" rx="15" fill="#EAF7FF" opacity="0.4"/>
      <rect x="196" y="568" width="164" height="30" rx="15" fill="#EAF7FF" opacity="0.26"/>
    </g>
  </g>
</svg>
