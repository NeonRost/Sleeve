<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FE3FF"/>
      <stop offset="0.38" stop-color="#35B4E8"/>
      <stop offset="1" stop-color="#0A5C8F"/>
    </linearGradient>
    <filter id="facetBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>
    <clipPath id="sleeveClip">
      <rect x="150" y="277" width="470"
            height="470" rx="20"/>
    </clipPath>
  </defs>
  <g id="background">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGradient)"/>
    <!-- Kristallfacetten: bei 1024 px spürbar, ab 128 px unsichtbar.
         Weichgezeichnet, damit keine Kante übrig bleibt, die das Verkleinern
         unbeschadet übersteht. -->
    <g filter="url(#facetBlur)" transform="translate(512.0,512.0) scale(1.242718) translate(-512.0,-512.0)">
      <polygon points="100,556 476,100 648,100 100,748" fill="#FFFFFF" opacity="0.05"/>
      <polygon points="924,262 924,486 596,924 372,924" fill="#FFFFFF" opacity="0.032"/>
    </g>
  </g>
</svg>
